# ============================================================
# NGINX Reverse Proxy Config - Board Governance System
# Internal network only
# ============================================================

upstream boardgov_backend {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    # Add more upstream servers for HA:
    # server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name boardgov.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name boardgov.internal;

    # ─── TLS ─────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/boardgov.crt;
    ssl_certificate_key /etc/nginx/ssl/boardgov.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ─── Security Headers ─────────────────────────────────────
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "DENY" always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Content-Security-Policy      "default-src 'self'" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;

    # ─── IP Restriction (internal network) ───────────────────
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # ─── Request Limits ───────────────────────────────────────
    client_max_body_size 30m;
    client_body_timeout  60s;
    client_header_timeout 30s;
    keepalive_timeout    65s;
    send_timeout         60s;

    # ─── Rate Limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ─── Proxy ───────────────────────────────────────────────
    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://boardgov_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Security: hide upstream headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Stricter rate limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://boardgov_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints (no rate limit)
    location ~ ^/(health|ready|live)$ {
        proxy_pass http://boardgov_backend;
        proxy_http_version 1.1;
        access_log off;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/boardgov_access.log combined;
    error_log  /var/log/nginx/boardgov_error.log warn;
}
