# NGINX Reverse Proxy Config for Board Governance System

upstream boardgov_backend {
    least_conn;
    server boardgov-svc:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name boardgov.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name boardgov.internal;

    ssl_certificate     /etc/nginx/ssl/boardgov.crt;
    ssl_certificate_key /etc/nginx/ssl/boardgov.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers (backend also sets these, belt+suspenders)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Allow only internal IPs
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    client_max_body_size 30M;
    client_body_timeout 30s;
    send_timeout 30s;

    # Auth rate limiting
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://boardgov_backend;
        include /etc/nginx/proxy_params;
    }

    # API rate limiting
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://boardgov_backend;
        include /etc/nginx/proxy_params;
    }

    # Health checks (no rate limit)
    location ~ ^/(health|ready|live)$ {
        proxy_pass http://boardgov_backend;
        access_log off;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/boardgov_access.log combined;
    error_log  /var/log/nginx/boardgov_error.log warn;
}
