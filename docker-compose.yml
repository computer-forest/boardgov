version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: boardgov-postgres
    environment:
      POSTGRES_USER: boardgov
      POSTGRES_PASSWORD: boardgov
      POSTGRES_DB: boardgov
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgov"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: boardgov-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      APP_ENV: development
    ports:
      - "8080:8080"
    volumes:
      - secure-storage:/secure-storage

volumes:
  pgdata:
  secure-storage:
